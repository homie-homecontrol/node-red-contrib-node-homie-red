<script type="text/javascript">
    RED.nodes.registerType('homie-vdevice-config', {
        category: 'config',
        color: '#00796b',
        defaults: {
            homieCfg: { value: "", type: "homie-config" },
            name: { value: "" },
            deviceSpecStr: {
                value: "", required: "true",
            },
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-circle",
        label: function () {
            return this.name || "homie-virtual-device";
        },
        oneditprepare: function () {
            $("#node-config-input-deviceSpecStr").typedInput({
                type: "json",
                types: ["json"]
            })
        },
        oneditsave: function () {
            $.post("nodeHomie/validateVDevice", { data: $("#node-config-input-deviceSpecStr").val() }, 'application/json')
                .done((result) => {
                    if (!result.valid) {
                        RED.notify(`${this.name} - Error in device spec.<br/><pre>${JSON.stringify(result.validationErrors, undefined, 2)}</pre>`, { type: 'error' });
                    }

                });
        }
    });
</script>

<script type="text/html" data-template-name="homie-vdevice-config">
    <style type="text/css">
        .form-row select {
          width: 70%;
        }
      </style>

    <div class="form-row">
        <label for="node-config-input-homieCfg"><i class="fa fa-tag"></i> Homie Config</label>
        <input type="text" id="node-config-input-homieCfg" placeholder="Homie Config">
    </div>
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-config-input-deviceSpecStr"><i class="fa fa-tag"></i> Device Spec (JSON)</label>
        <input type="text" id="node-config-input-deviceSpecStr" placeholder="{ ... }">
    </div>
</script>

<script type="text/html" data-help-name="homie-vdevice-config">
    <p>A configuration node that creates a virtual Homie v5 device owned by Node-RED.</p>
    <p>The specification is provided as JSON and validated against the generated schema.</p>

    <p>Compared to the MQTT topic structure, this JSON model has two key differences:</p>
    <ul>
        <li>Homie attributes are written without the <code>$</code> prefix (for example <code>name</code> instead of <code>$name</code>)</li>
        <li><code>nodes</code> and <code>properties</code> are arrays with explicit <code>id</code> fields</li>
    </ul>

    <p><strong>Structure</strong></p>
    <p>Device:</p>
    <pre><code class="lang-yaml">id: deviceId
name: device name
nodes:
  - node1
  - node2
</code></pre>

    <p>Node:</p>
    <pre><code class="lang-yaml">id: nodeId
name: node name
type: node type
properties:
  - property1
  - property2
</code></pre>

    <p>Property:</p>
    <pre><code class="lang-yaml">id: propertyId
name: property name
datatype: boolean
settable: true
</code></pre>

    <p>Combined example:</p>
    <pre><code class="lang-json">{
  "id": "node-red-virtual-device-1",
  "name": "Virtual test device",
  "nodes": [
    {
      "id": "switch",
      "name": "Virtual switch",
      "type": "virtual-switch",
      "properties": [
        {
          "id": "state",
          "datatype": "boolean",
          "name": "Virtual switch state",
          "settable": true,
          "passThrough": false,
          "propertyOpts": {
            "readValueFromMqtt": true
          }
        }
      ]
    }
  ]
}
</code></pre>

    <p>Homie v5 publishes this device below <code>{topicRoot}/5/{deviceId}/...</code> using <code>$description</code> and <code>$state</code>.</p>

    <p><strong>Optional Homie v5 device hierarchy fields</strong></p>
    <pre><code class="lang-json">{
  "id": "child-device",
  "name": "Child Device",
  "type": "custom-type",
  "root": "root-device",
  "parent": "parent-device",
  "children": ["child-a", "child-b"],
  "extensions": ["my-extension"],
  "nodes": []
}
</code></pre>

    <p><strong>General notes</strong></p>
    <ul>
        <li>Do not specify runtime-managed fields like <code>state</code> or <code>homie</code> in the JSON spec</li>
        <li><code>id</code> and <code>nodes</code> are required at device level</li>
        <li>All IDs must follow the Homie ID format</li>
    </ul>

    <p><strong>Node level extra configuration</strong></p>
    <p><code>passThrough</code> (boolean, default <code>false</code>):</p>
    <ul>
        <li>if <code>true</code>, matching <code>/set</code> values are auto-confirmed to value state</li>
        <li>if <code>false</code>, update values yourself using <code>vprop value (homie-vproperty-value-update)</code></li>
    </ul>

    <p><code>fromSmarthome</code> (object):</p>
    <ul>
        <li>uses <code>hc-node-homie-smarthome</code> capability templates for fast node creation</li>
    </ul>

    <p><strong>Property level extra configuration</strong></p>
    <p><code>passThrough</code> (boolean, default <code>false</code>):</p>
    <ul>
        <li>if <code>true</code>, property auto-confirms incoming <code>/set</code> values</li>
        <li>if <code>false</code>, handle updates in your flow</li>
        <li>property-level setting overrides node-level setting</li>
    </ul>

    <p><code>propertyOpts</code> (object, default <code>{ "readValueFromMqtt": true, "readTimeout": 3000 }</code>):</p>
    <ul>
        <li><code>readValueFromMqtt</code>: read retained value during initialization</li>
        <li><code>readTimeout</code>: max wait time in milliseconds for retained value read</li>
    </ul>

    <p><a name="reference-smarthome-spec"></a><strong>Smarthome Spec</strong></p>
    <p>The smarthome spec provides capability-based defaults using <code>hc-smarthome/v2/cap/*</code> types.</p>

    <pre><code class="lang-json">{
  "id": "node-red-virtual-device-2",
  "name": "Virtual switch device",
  "nodes": [
    {
      "id": "switch",
      "fromSmarthome": {
        "type": "hc-smarthome/v2/cap/switch"
      }
    }
  ]
}
</code></pre>

    <p>Supported capability types:</p>
    <ul>
        <li><code>hc-smarthome/v2/cap/battery</code></li>
        <li><code>hc-smarthome/v2/cap/switch</code></li>
        <li><code>hc-smarthome/v2/cap/contact</code></li>
        <li><code>hc-smarthome/v2/cap/climate</code></li>
        <li><code>hc-smarthome/v2/cap/button</code></li>
        <li><code>hc-smarthome/v2/cap/tilt</code></li>
        <li><code>hc-smarthome/v2/cap/motion</code></li>
        <li><code>hc-smarthome/v2/cap/thermostat</code></li>
        <li><code>hc-smarthome/v2/cap/mediaplayer</code></li>
        <li><code>hc-smarthome/v2/cap/powermeter</code></li>
        <li><code>hc-smarthome/v2/cap/maintenance</code></li>
        <li><code>hc-smarthome/v2/cap/level</code></li>
        <li><code>hc-smarthome/v2/cap/shutter</code></li>
        <li><code>hc-smarthome/v2/cap/color</code></li>
        <li><code>hc-smarthome/v2/cap/text</code></li>
    </ul>

    <p><strong><em>Overriding or extending defaults</em></strong></p>
    <p>You can provide <code>properties</code> together with <code>fromSmarthome</code>. Matching property IDs override generated defaults where supported; additional properties are allowed but may no longer match the standard profile.</p>

    <p><strong>Technical details</strong></p>
    <p>For the full and current schema reference see <code>docs/vdevice-config-datamodel.md</code>.</p>
    <p>The runtime validator uses the generated schema at <code>lib/vDevice.schema.json</code>.</p>
</script>
