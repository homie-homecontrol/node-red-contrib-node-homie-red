<script type="text/javascript">
    RED.nodes.registerType('homie-device-log', {
        category: 'homie',
        color: '#00796b',
        defaults: {
            homieCfg: { value: "", type: "homie-config" },
            name: { value: "" },
            device: { value: "", required: "true" }
        },
        inputs: 0,
        outputs: 1,
        icon: "font-awesome/fa-file-text-o",
        outputLabels: ["log event"],
        paletteLabel: 'Device Log',
        label: function () {
            return this.name || "homie-device-log";
        },
        oneditprepare: function () {
            const node = this;

            function getLabel(item) {
                if (item.label) {
                    return `${item.label} (${item.value})`;
                } else {
                    return item.value;
                }
            }

            function updateSelectionList(attrId, list, value) {
                const selectionListElem = $(`#node-input-${attrId}`);
                if (!selectionListElem) { return; }

                selectionListElem.children().remove();

                list.forEach(item => {
                    if (item.value !== value) {
                        selectionListElem.append('<option value="' + item.value + '">' + getLabel(item) + '</option>');
                    } else {
                        selectionListElem.append('<option value="' + item.value + '" selected="true">' + getLabel(item) + '</option>');
                    }
                });

                selectionListElem.val(value);
            }

            function updateDeviceList(node) {
                const homieCfg = $("#node-input-homieCfg").find(":selected").val();
                $.getJSON("nodeHomie/deviceList", { homieCfg })
                    .done(function (data) {
                        updateSelectionList(
                            'device',
                            data.map(device => { return { value: device.id, label: device.name } }),
                            $("#node-input-device").val() || node.device
                        );
                    });
            }

            $('#node-input-homieCfg').change(function () {
                updateDeviceList(node);
            });
        }
    });
</script>

<script type="text/html" data-template-name="homie-device-log">
    <style type="text/css">
        .form-row select {
            width: 70%;
        }
    </style>

    <div class="form-row">
        <label for="node-input-homieCfg"><i class="fa fa-tag"></i> Homie Config</label>
        <input type="text" id="node-input-homieCfg" placeholder="Homie Config">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-tag"></i> Select Device</label>
        <select id="node-input-device" placeholder="Device"></select>
    </div>
</script>

<script type="text/html" data-help-name="homie-device-log">
    <p>Emits log events from a discovered device under <code>$log/&lt;level&gt;</code>.</p>
    <h3>Output</h3>
    <pre><code>
{
    "device": "heater-1",
    "level": "warn",
    "topic": "heater-1/$log/warn",
    "payload": "burner delayed",
    "message": "burner delayed"
}
    </code></pre>
</script>
