<script type="text/javascript">
    RED.nodes.registerType('homie-property-target', {
        category: 'homie',
        color: '#00796b',
        defaults: {
            homieCfg: { value: "", type: "homie-config" },
            name: { value: "" },
            device: { value: "" },
            node: { value: "" },
            property: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-bullseye",
        inputLabels: 'emit current target value',
        outputLabels: ["property target"],
        paletteLabel: 'Property Target',
        label: function () {
            return this.name || this.property || "homie-property-target";
        },
        oneditprepare: function () {
            const node = this;

            function getLabel(item) {
                if (item.label) {
                    return `${item.label} (${item.value})`;
                } else {
                    return item.value;
                }
            }

            function updateSelectionList(attrId, list, value) {
                const selectionListElem = $(`#node-input-${attrId}`);
                if (!selectionListElem) { return; }

                selectionListElem.children().remove();

                list.forEach(item => {
                    if (item.value !== value) {
                        selectionListElem.append('<option value="' + item.value + '">' + getLabel(item) + '</option>');
                    } else {
                        selectionListElem.append('<option value="' + item.value + '" selected="true">' + getLabel(item) + '</option>');
                    }
                });
                selectionListElem.val(value);
            }

            function updateDeviceList(node) {
                const homieCfg = $("#node-input-homieCfg").find(":selected").val();
                $.getJSON("nodeHomie/deviceList", { homieCfg })
                    .done(function (data) {
                        updateSelectionList(
                            'device',
                            data.map(device => { return { value: device.id, label: device.name } }),
                            $("#node-input-device").val() || node.device
                        );
                    });
            }

            function updateNodesList(node) {
                const homieCfg = $("#node-input-homieCfg").find(":selected").val();
                const deviceId = $("#node-input-device").val() || node.device;
                $.getJSON("nodeHomie/nodesList", { homieCfg, deviceId })
                    .done(function (data) {
                        updateSelectionList(
                            'node',
                            data.map(node => { return { value: node.id, label: node.name } }),
                            $("#node-input-node").val() || node.node
                        );
                    });
            }

            function updatePropertiesList(node) {
                const homieCfg = $("#node-input-homieCfg").find(":selected").val();
                const deviceId = $("#node-input-device").val() || node.device;
                const nodeId = $("#node-input-node").val() || node.node;
                $.getJSON("nodeHomie/propertiesList", { homieCfg, deviceId, nodeId })
                    .done(function (data) {
                        updateSelectionList(
                            'property',
                            data.map(prop => { return { value: prop.pointer, label: prop.name } }),
                            $("#node-input-property").val() || node.property
                        );
                    });
            }

            $('#node-input-homieCfg').change(function () {
                updateDeviceList(node);
                updateNodesList(node);
                updatePropertiesList(node);
            });

            $('#node-input-device').change(function () {
                updateNodesList(node);
                updatePropertiesList(node);
            });

            $('#node-input-node').change(function () {
                updatePropertiesList(node);
            });

        }
    });
</script>

<script type="text/html" data-template-name="homie-property-target">
    <style type="text/css">
        .form-row select {
            width: 70%;
        }
    </style>

    <div class="form-row">
        <label for="node-input-homieCfg"><i class="fa fa-tag"></i> Homie Config</label>
        <input type="text" id="node-input-homieCfg" placeholder="Homie Config">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-tag"></i> Device</label>
        <select id="node-input-device" placeholder="Device"></select>
    </div>
    <div class="form-row">
        <label for="node-input-node"><i class="fa fa-tag"></i> Node</label>
        <select id="node-input-node" placeholder="Node"></select>
    </div>
    <div class="form-row">
        <label for="node-input-property"><i class="fa fa-tag"></i> Property</label>
        <select id="node-input-property" placeholder="Property"></select>
    </div>
</script>

<script type="text/html" data-help-name="homie-property-target">
    <p>Represents a discovered homie property target value (<code>$target</code>). Will emit target updates.</p>
    <h3>Input:</h3>
    <p>If a message is sent to the node, the currently known target value is emitted. If no property is configured, <code>msg.topic</code> can be used to select a property pointer (<code>deviceId/nodeId/propertyId</code>).</p>
    <h3>Output:</h3>
    <p>Will output target value changes or current target value on input trigger.</p>
    <pre><code>
{
    "topic": "heater-1/thermostat/temperature",
    "payload": "22.5",
    "target": "22.5",
    "homieDevice": "heater-1",
    "homieNode": "thermostat",
    "homieProperty": "temperature"
}
    </code></pre>
</script>
